name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testdatenbank mit Nicht-Superuser anlegen (RLS-Test)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE companygpt LOGIN PASSWORD 'companygpt' NOSUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE companygpt_test OWNER companygpt;"
          psql -h localhost -U postgres -d companygpt_test -c "CREATE EXTENSION vector; CREATE EXTENSION pgcrypto;"
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://companygpt:companygpt@localhost:5432/companygpt_test
